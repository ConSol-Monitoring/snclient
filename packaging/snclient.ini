; metrics interval - Collection interval for CPU and network metrics.
metrics interval = 5s

; device filter - Exclude matching network devices from network metrics, for example temporary devices.
device filter = ^veth


; Unix system - Section for non windows system checks
[/settings/system/unix]


; Windows system - Section for windows system checks and system settings
[/settings/system/windows]


[/settings/updates]
; automatic updates - Update snclient automatically.
automatic updates = disabled

; automatic restart - Restart SNClient automatically after an update.
automatic restart = disabled

; channel - Comma-separated list of channels to search for updates.
channel = stable

; pre release - Include prereleases from the stable channel.
pre release = false

; insecure - Skip all ssl verifications.
insecure = false

; update hours - Set time range(s) in which updates are allowed.
update hours = 0-24

; update days - set day range(s) in which updates are allowed.
update days = mon-sun

; update interval - how often should snclient check for updates
update interval = 1h


[/settings/updates/channel]
