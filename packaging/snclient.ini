; Builtin plugins settings - General settings for the builtin plugins
[/settings/builtin plugins]


; builtin plugins: default - The configuration section for all builtin plugins
[/settings/builtin plugins/default]

; disabled - Disable this command
disabled = false


; check_files settings - configure settings for check_files
[/settings/check/files]
; max files limit - sets the upper limit for the max-files argument in check_files
max files limit = 100000


; check_logfile settings - configure settings for check_logfile
; do not mix up with log settings for the snclient itself which are in [/settings/log]
[/settings/check/logfile]

; allowed pattern - Comma-separated list of glob patterns that check_logfile can check.
allowed pattern  = /var/log/**
allowed pattern += ${shared-path}/*.log
allowed pattern += /var/log/snclient/snclient.log

; max lines per file limit - sets the upper limit for the max-lines argument in check_logfile
max lines per file limit = 1000000


[/settings/check/multi]
; max checks - Maximum number of checks in check_multi. Applies to configuration sections and inline commands.
max checks = 20


; External script settings - General settings for the external scripts module (CheckExternalScripts).
[/settings/external scripts]

; timeout - Maximum command execution time in seconds. Abort the command if it exceeds this limit.
; This limit applies only to external commands, not internal commands.
; Set /settings/default/timeout higher than this limit. Otherwise, the connection closes before the script finishes.
timeout = 60

; Allow arguments when executing external scripts - Allow clients to specify command arguments.
; Before you enable this option, read https://omd.consol.de/docs/snclient/security/#external-commands
allow arguments = false

; Allow certain potentially dangerous characters in arguments - Allow characters listed in nasty characters.
; Before you change this option, read https://omd.consol.de/docs/snclient/security/#external-commands
allow nasty characters = false

; allow control characters - Allow ASCII control characters in arguments.
; Before you change this option, read https://omd.consol.de/docs/snclient/security/#external-commands
allow control characters = false

; Script root folder - Root folder for scripts. External script wrappers use this path.
script root = ${scripts}

; Load all scripts in a given folder - Load all (${script path}/*) scripts as commands.
; Any executable file counts as a script. It does not need a script extension.
; On Windows, SNClient cannot identify executable files this way, so it adds every file in the folder.
; SNClient follows links and adds them as scripts if their targets are under script path.
; If the path ends with **, SNClient also searches subdirectories.
script path =

; ignore perfdata - Do not parse performance data from the output
ignore perfdata = no


; Command aliases - Aliases for existing commands with arguments.
; An alias combines a command and predefined arguments into one command that needs no arguments.
; Do not create loops, for example check_loop=check_a, check_a=check_loop.
[/settings/external scripts/alias]


; alias: default - The configuration section for the default alias
[/settings/external scripts/alias/default]

; ignore perfdata - Do not parse performance data from the output
ignore perfdata = no

; command - Command to execute
command =


; External scripts - A list of scripts available to run from the CheckExternalScripts module.
; Syntax is: `commandname = path/script arguments...`
; If arguments are allowed, %ARGS% expands to the arguments without quotes.
; %ARGS"% expands to the arguments with quotes. Prefer this form.
[/settings/external scripts/scripts]


; script: default - Configuration section for the default script.
[/settings/external scripts/scripts/default]

; ignore perfdata - Do not parse performance data from the output
ignore perfdata = no

; command - Command to execute
command =


; Wrapped scripts - Scripts that use command templates.
; The script extension selects the template.
; For example, foo.ps1 uses the ps1 template from the wrappings section.
; Syntax is: `command=script`
[/settings/external scripts/wrapped scripts]


; Script wrappings - Templates for script commands.
; Enter command lines here. SNClient expands them for scripts in the wrapped scripts section.
; %SCRIPT% expands to the script. %ARGS% expands to its arguments.
[/settings/external scripts/wrappings]

; Batch file - Command used for executing wrapped batch files
bat = ${script root}\\%SCRIPT% %ARGS%

; Visual basic script - Command line used for wrapped vbs scripts
vbs = cscript.exe //T:30 //NoLogo "${script root}\%SCRIPT%" %ARGS%

; Powershell Wrapping - Command line used for executing wrapped ps1 (powershell) scripts
ps1 = cmd /c echo If (-Not (Test-Path "${script root}\%SCRIPT%") ) { Write-Host "UNKNOWN: Script `"%SCRIPT%`" not found."; exit(3) }; ${script root}\%SCRIPT% $ARGS$; exit($lastexitcode) | powershell.exe -nologo -noprofile -WindowStyle hidden -NonInteractive -ExecutionPolicy Bypass -command -


; log - Configure log properties.
[/settings/log]

; file name - File for log data.
