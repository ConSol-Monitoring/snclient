[/paths]
; exe-path - Path to snclient executable (auto-detected).
exe-path =

; shared-path - Path to shared files.
shared-path = /etc/snclient

; scripts - Path to scripts.
scripts = ${shared-path}/scripts

; certificate-path - Path for certificates.
certificate-path = ${shared-path}

; cache-path - Path for temporary cache files. If empty, use the system temp folder. The CACHE_DIRECTORY environment variable can override this path.
cache-path =


[/modules]
; WEBServer - Enable HTTP REST API requests via check_snclient / check_nsc_web.
WEBServer = enabled

; WEBAdminServer - Enable HTTP REST API requests for administrative tasks.
WEBAdminServer = disabled

; NRPEServer - Enable NRPE server.
NRPEServer = disabled

; PrometheusServer - Enable /metrics HTTP server for the agent itself.
PrometheusServer = disabled

; NodeExporterServer - Enable the Prometheus Linux node exporter.
NodeExporterServer = disabled

; WindowsExporterServer - Enable the Prometheus Windows exporter.
WindowsExporterServer = disabled

; ExporterExporterServer - Enable the Prometheus exporter_exporter server.
ExporterExporterServer = disabled

; ManagedExporterServer - Enable a managed custom Prometheus exporter.
ManagedExporterServer = disabled

; CheckBuiltinPlugins - Enable built-in plugins from /settings/builtin plugins/... such as check_snclient / check_nsc_web / check_http.
CheckBuiltinPlugins = disabled

; CheckAlias - Enable script aliases from /settings/external scripts/alias
CheckAlias = enabled

; CheckExternalScripts - Enable scripts from /settings/external scripts/...
CheckExternalScripts = disabled

; CheckSystem - Collect Windows CPU metrics for the check_cpu plugin.
CheckSystem = enabled

; CheckSystemUnix - Collect non-Windows CPU metrics for the check_cpu plugin.
CheckSystemUnix = enabled

; CheckDisk - Allow check_drivesize.
CheckDisk = enabled

; CheckDriveIO - Allow check_drive_io.
CheckDriveIO = enabled

; CheckSwapIO - Allow check_swap_io.
CheckSwapIO = enabled

; CheckWMI - Allow check_wmi.
CheckWMI = disabled

; CheckLogFile - Allow check_logfile.
CheckLogFile = disabled

; CheckMulti - Allow check_multi.
CheckMulti = enabled


[/settings/default]
; allowed hosts - Comma-separated list of IP addresses, networks, or hostnames that can connect.
allowed hosts  = 127.0.0.1
allowed hosts += ::1

; cache allowed hosts - Cache resolved DNS names.
cache allowed hosts = true

; timeout - Timeout when reading packets on incoming sockets.
timeout = 30

; bind to - Bind the server to a specific local address.
; Use a dotted IP address, not a hostname. Leave empty to bind to all available IP addresses.
bind to =

; tls min version - Set the minimum allowed TLS version. Leave empty to allow all versions.
; Valid values: tls1.0, tls1.1, tls1.2, tls1.3
tls min version = tls1.2

; insecure - Skip all SSL verification for HTTP client connections.
insecure = false

; nasty characters - List of forbidden characters in arguments (if allow nasty characters is false)
nasty characters = $|`&><'"\[]{};\n\r

; certificate - SSL certificate to use for the listeners.
certificate = ${certificate-path}/server.crt

; certificate key - ssl private key to use for the listeners.
certificate key = ${certificate-path}/server.key

; client certificates - require client certificate (list of pem files).
;client certificates = ${certificate-path}/client1.pem, ${certificate-path}/client2.pem

; password - Change the default value.
; Store a password hash with the format <HASH>:<hashed password>, for example SHA256:...
; SHA256 is supported. Use "snclient hash" to generate password hashes.
password = CHANGEME

; require password - Control whether clients must provide a password to connect.
require password = true

; use HSTS header - Add the HSTS header to HTTP responses.
use hsts header = disabled


[/settings/ExporterExporter/server]
; ExporterExporterServer - Enable the Prometheus exporter_exporter server. If uncommented, this setting overrides the global option in /modules.
;ExporterExporterServer = disabled

; port - Port to use for exporter_exporter.
port = ${/settings/WEB/server/port}

; use ssl - Enable SSL.
use ssl = ${/settings/WEB/server/use ssl}

; url prefix - Set the URL prefix for /list and /proxy.
url prefix = /

; modules dir - Folder that contains YAML module definitions.
modules dir = ${shared-path}/exporter_modules

; modules dir watcher - Reload modules when files change, including writes, creations, deletions, and renames.
modules dir watcher = disabled

; default module - Module to use if the request does not specify one.
default module =

; allowed methods - Comma-separated list of allowed exporter_exporter methods: http, exec, and file. If set, load only modules that use these methods.
allowed methods =

; You can use default web attributes here, such as password, allowed hosts, and certificates.


;[/settings/ManagedExporter/example]
; ManagedExporterServer - Enable a managed custom Prometheus exporter. If uncommented, this setting overrides the global option in /modules.
;ManagedExporterServer = disabled

; agent path - sets path to prometheus-exporter binary
;agent path = ${shared-path}/prometheus/custom_exporter.exe

; agent args - sets additional arguments for the node exporter
;agent args = --web.listen-address=${agent address}

; agent port - sets internal listen address (ex.: --web.listen-address=)
;agent address = 127.0.0.1:9990

; agent max memory - Memory limit for the agent. If RSS exceeds this limit, restart the agent. Set to 0 to disable.
;agent max memory = 256M

; agent user - User to run the agent as. Requires root permissions.
