; level - Log level to use. Available levels are error,warning,info,debug,trace.
level = info


; log file - Configure log file properties.
[/settings/log/file]

; max size - Move the file to log.old when its size reaches this limit in bytes. Set to 0 to disable rotation. Units such as 10MiB are supported.
max size = 0


[/settings/process memory]
