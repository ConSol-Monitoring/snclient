; port - Port to use for the node exporter.
;port = ${/settings/WEB/server/port}

; use ssl - Enable SSL.
;use ssl = ${/settings/WEB/server/use ssl}

; url prefix - set prefix to provided urls (/exportername)
;url prefix = /example

; url match - URL pattern to forward to the exporter. Use * to forward all URLs below the prefix.
;url match = /metrics

; kill already running exporters based on path and args
;kill orphaned = enabled


[/settings/NRPE/server]
; Enable the NRPE server. If uncommented, this setting overrides the global option in /modules.
